apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4 # Khởi chạy 4 bản sao hệ thống
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: w9-api:1 # Gọi đúng tên Image bạn đã load vào Minikube ở Lab 2
        imagePullPolicy: IfNotPresent # Lưu ý: Bắt buộc dùng dòng này để k8s lấy thẳng image dưới máy, không lên Docker Hub tìm
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ERROR_RATE
          value: "0" # Bản v1 thiết lập tỉ lệ lỗi bằng 0 (chạy mượt mà)
        - name: VERSION
          value: "v2"
        readinessProbe: # Bộ kiểm tra sức khỏe, đảm bảo app khởi động xong mới cho nhận traffic
          httpGet:
            path: /healthz
            port: 8080
  strategy:
    canary: # Định nghĩa các bước giải phóng traffic cho Lab 4
      steps:
        - setWeight: 25
        - pause: {} # Chờ duyệt thủ công (Sẽ dùng ở Lab 4)
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080